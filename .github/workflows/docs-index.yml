name: docs-index

# The `testkube` skill carries a curated index of docs.testkube.io URLs. Docs
# move; the index does not. This job is the only layer that cannot be forgotten
# — it catches deleted pages and, because it does not follow redirects, slugs
# that were renamed behind an entry in the docs repo's redirects.js.
#
# It does NOT catch new pages that ought to be indexed. Reviewing
# https://docs.testkube.io/changelog stays a human job.

on:
  push:
    branches: [main]
    paths:
      - 'plugins/testkube-skills/skills/testkube/SKILL.md'
      - 'tests/docs-index/**'
      - '.github/workflows/docs-index.yml'
  pull_request:
    paths:
      - 'plugins/testkube-skills/skills/testkube/SKILL.md'
      - 'tests/docs-index/**'
      - '.github/workflows/docs-index.yml'
  schedule:
    # Mondays 06:00 UTC — catches drift introduced by the docs repo, not by us.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the curated docs index
        id: check
        run: |
          set -o pipefail
          bash tests/docs-index/run.sh 2>&1 | tee result.txt

      # Scheduled runs have no PR to annotate, so file an issue instead of
      # failing into a log nobody reads. Reuses one open issue rather than
      # opening a new one every Monday.
      - name: Open or update a tracking issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="docs index is stale: broken or redirected links in the testkube skill"
          body="$(printf 'The weekly docs-index check failed. Update the **Docs index** in `plugins/testkube-skills/skills/testkube/SKILL.md`.\n\nA `301` means the page still resolves but the index carries a stale slug — replace it with the redirect target.\n\n```\n%s\n```\n\n[Workflow run](%s/%s/actions/runs/%s)\n' \
            "$(tail -60 result.txt)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"

          existing="$(gh issue list --state open --search "$title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
